<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sql-workbench</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232e3440'/%3E%3Cpath d='M3 5l3 3-3 3M7.5 11H13' stroke='%2381a1c1' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Theme FOUC guard — shared pharos_theme key with Pharos; the bench
         follows it (and the live relay) once mounted. -->
    <script>
      ;(function () {
        var t = localStorage.getItem('pharos_theme')
        if (!t || t === 'system') {
          t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <style>
      /* Page chrome only — all bench styling lives in the shadow root. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      sql-workbench {
        display: block;
        height: 100vh;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <noscript>sql-workbench needs JavaScript.</noscript>
  </body>
</html>
