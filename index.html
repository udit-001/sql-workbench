<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sql-workbench</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232e3440'/%3E%3Cpath d='M3 5l3 3-3 3M7.5 11H13' stroke='%2381a1c1' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Theme FOUC guard — shared pharos_theme key with Pharos; LEARN-205
         adds the live postMessage relay for embedded mode. -->
    <script>
      ;(function () {
        var t = localStorage.getItem('pharos_theme')
        if (!t || t === 'system') {
          t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-view="query">
    <header class="top">
      <span class="name">sql-workbench</span>
      <span class="chip" id="dataset-chip" hidden></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="theme-toggle" aria-label="Toggle light or dark theme" title="Theme">◐</button>
    </header>

    <!-- Mobile-only view switcher (spec user story 17) -->
    <nav class="seg" aria-label="Bench sections">
      <button type="button" data-seg="schema">Schema</button>
      <button type="button" data-seg="query" class="on">Query</button>
      <button type="button" data-seg="results">Results</button>
    </nav>

    <div class="shell">
      <aside class="schema" id="schema-panel" aria-label="Tables in this sample dataset"></aside>

      <section class="main">
        <div class="ed-tools">
          <button class="run" id="run-btn">▸ Run query</button>
          <button class="ghost" id="reset-btn" title="Restore the original sample data">Reset data</button>
          <span class="spacer"></span>
          <span class="kbd-hint"><kbd id="modkey">Ctrl</kbd>+<kbd>Enter</kbd> to run</span>
        </div>

        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          aria-label="SQL query"
          placeholder="Type SQL, then press Ctrl+Enter…"
        ></textarea>

        <section id="results" class="results" aria-live="polite" aria-label="Query results"></section>

        <footer class="statusbar" id="statusbar">Ready</footer>
      </section>
    </div>
  </body>
</html>
