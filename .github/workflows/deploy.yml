# Pages (the docs + demo site) deploys on every push to main.
# Releases (pinned component artifact for jsDelivr/vendoring) only on v* tags.
name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package asset zip
        run: (cd dist && zip -r ../sql-workbench-asset.zip .)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: asset-zip
          path: sql-workbench-asset.zip
      - uses: actions/upload-artifact@v4
        with:
          name: component-js
          path: dist/sql-workbench.js

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, "refs/tags/")
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asset-zip
      - uses: actions/download-artifact@v4
        with:
          name: component-js
      - name: Attach assets to release
        run: gh release create "$GITHUB_REF_NAME" sql-workbench-asset.zip sql-workbench.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
